<!doctype html>
<html>
  <head>
    <title>404</title>
  </head>
  <body>
    <script>
      const pt = location.pathname.split('/')
      location.replace(
        `/${pt[1]}/?page=${pt
          .slice(2)
          .join('/')}${location.search.replace(/^\?/, '&')}${location.hash}`,
      )
    </script>
  </body>
</html>
